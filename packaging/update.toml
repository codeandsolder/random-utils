# Stable bootstrap config. This file owns updater-global settings and the
# self-update package; fleet packages live in update.d fragments so a random-utils
# release can update the manager and its package inventory in one transaction.

state_dir = "/var/lib/random-utils/updater"
max_download_bytes = 536870912
include_dir = "/etc/random-utils/update.d"

[[package]]
name = "random-utils"
min_interval_seconds = 900

[package.source]
type = "github-release"
repo = "codeandsolder/random-utils"

[[package.artifact]]
asset = "random-utils-update-x86_64-linux-gnu"
checksum_asset = "{asset}.sha256"
destination = "/usr/local/bin/random-utils-update"
mode = 0o755
owner = "root"
group = "root"

[[package.artifact]]
asset = "update.toml"
checksum_asset = "{asset}.sha256"
destination = "/etc/random-utils/update.toml"
mode = 0o644
owner = "root"
group = "root"

[[package.artifact]]
asset = "10-base.toml"
checksum_asset = "{asset}.sha256"
destination = "/etc/random-utils/update.d/10-base.toml"
mode = 0o644
owner = "root"
group = "root"

[[package.artifact]]
asset = "random-utils-update.service"
checksum_asset = "{asset}.sha256"
destination = "/etc/systemd/system/random-utils-update.service"
mode = 0o644
owner = "root"
group = "root"

[[package.artifact]]
asset = "random-utils-update.timer"
checksum_asset = "{asset}.sha256"
destination = "/etc/systemd/system/random-utils-update.timer"
mode = 0o644
owner = "root"
group = "root"

[[package.post_update]]
program = "/usr/bin/systemctl"
args = ["daemon-reload"]
timeout_seconds = 30

[[package.post_update]]
program = "/usr/bin/systemctl"
args = ["try-restart", "random-utils-update.timer"]
timeout_seconds = 30

[[package.rollback]]
program = "/usr/bin/systemctl"
args = ["daemon-reload"]
timeout_seconds = 30

[[package.rollback]]
program = "/usr/bin/systemctl"
args = ["try-restart", "random-utils-update.timer"]
timeout_seconds = 30
