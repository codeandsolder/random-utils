name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-shared-sccache:
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@ce8f8a2849c8cc0ce221e4cb283a4bef0de4a01a # main
    with:
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: >-
        cargo fmt --all -- --check &&
        CARGO_BUILD_WARNINGS=deny cargo check --locked --workspace --all-targets &&
        CARGO_BUILD_WARNINGS=deny cargo clippy --locked --workspace --all-targets -- -D warnings &&
        cargo test --locked --workspace

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-shared-sccache]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@ce8f8a2849c8cc0ce221e4cb283a4bef0de4a01a # main
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
      - name: Setup mandatory release compiler cache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@ce8f8a2849c8cc0ce221e4cb283a4bef0de4a01a # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"
      - name: Build release artifacts
        run: cargo build --locked --release --workspace
      - name: Finalize mandatory release compiler cache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@ce8f8a2849c8cc0ce221e4cb283a4bef0de4a01a # main
      - name: Assemble write-once release
        run: |
          set -euo pipefail
          install -d dist
          install -m 0755 target/release/random-utils-update dist/random-utils-update-x86_64-linux-gnu
          install -m 0755 target/release/crawl-killer dist/crawl-killer-x86_64-linux-gnu
          install -m 0755 target/release/evictable-run dist/evictable-run-x86_64-linux-gnu
          install -m 0755 target/release/laptop-policy dist/laptop-policy-x86_64-linux-gnu
          install -m 0644 packaging/update.toml dist/update.toml
          install -m 0644 packaging/update.d/10-base.toml dist/10-base.toml
          install -m 0644 packaging/random-utils-update.service dist/random-utils-update.service
          install -m 0644 packaging/random-utils-update.timer dist/random-utils-update.timer
          sudo install -d -m 0755 /etc/random-utils/update.d
          sudo install -m 0644 dist/10-base.toml /etc/random-utils/update.d/10-base.toml
          package_list="$(target/release/random-utils-update --config dist/update.toml --list)"
          test "$package_list" = $'random-utils\nrs-linux-exporter\nsccache'
          (
            cd dist
            for asset in *; do
              sha256sum "$asset" >"$asset.sha256"
            done
          )
      - name: Publish release for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="auto-${GITHUB_SHA}"
          title="random-utils ${GITHUB_SHA::12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            trap 'rm -rf "$existing"' EXIT
            gh release download "$tag" --dir "$existing"
            diff -u \
              <(find dist -maxdepth 1 -type f -printf '%f\n' | sort) \
              <(find "$existing" -maxdepth 1 -type f -printf '%f\n' | sort)
            for asset in dist/*; do
              cmp -- "$asset" "$existing/${asset##*/}"
            done
            echo "release $tag already exists with identical assets; leaving it untouched"
          else
            gh release create "$tag" dist/* --title "$title" --notes "Automated write-once release for ${GITHUB_SHA}." --latest
          fi
