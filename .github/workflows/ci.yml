name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@main

  rust-1-99-shared-sccache:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@main
    with:
      rust-toolchain: "1.99.0"
      rust-components: "clippy rustfmt"
      rustflags: "-C target-cpu=x86-64-v2"
      command: >-
        cargo +1.99.0 fmt --all -- --check &&
        CARGO_BUILD_WARNINGS=deny cargo +1.99.0 check --locked --workspace --all-targets &&
        CARGO_BUILD_WARNINGS=deny cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings &&
        cargo +1.99.0 test --locked --workspace
