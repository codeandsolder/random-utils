name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@169c8823c1bb0f5e5645ad813b441d605d49d5bb # main
