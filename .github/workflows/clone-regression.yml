name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main

  merge-gate:
    name: Duplicate-code merge gate
    if: ${{ always() }}
    needs: [duplicates]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["duplicates","success"]]
