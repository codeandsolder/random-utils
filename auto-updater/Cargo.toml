[package]
name = "random-utils-update"
version = "0.1.0"
description = "Declarative transactional updater for small host utilities"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.100"
fs2 = "0.4.3"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.23.0"
toml = "1.0.0"
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "aad8f97d78e40c4c9fc0ddbb0cf88af870f848ac", features = ["stream", "system-proxy"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = "0.3"

[lints]
workspace = true
